[package]
name = "worktree-deck"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Safe Git worktree manager with a structured CLI and terminal UI"
license = "MIT"
repository = "https://github.com/Andersonlimahw/worktree-deck"
readme = "README.md"
authors = ["Anderson Lima"]

[[bin]]
name = "worktree-deck"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
crossterm = "0.28.1"
ratatui = "0.28.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
